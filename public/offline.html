<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>УТИ — нет связи с сервером</title>
    <style>
        :root { color-scheme: light dark; --bg: #f5f6fa; --card: #fff; --text: #0f172a; --muted: #64748b; --accent: #4f46e5; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0b1020; --card: #121a2e; --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1; } }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
               background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        .card { max-width: 440px; width: 100%; background: var(--card); border-radius: 18px; padding: 28px 24px; text-align: center;
                box-shadow: 0 10px 40px -12px rgba(15, 23, 42, .25); }
        .icon { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
                background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
        button { height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer; }
        .hint { margin-top: 14px; font-size: .8rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">
            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M3 3l18 18M8.464 15.536a5 5 0 01-.243-6.833M15.536 8.464a5 5 0 01.95 5.536"/></svg>
        </div>
        <h1>Нет связи с сервером</h1>
        <p>Проверьте сеть. Страница откроется сама, как только связь появится.</p>
        <button type="button" onclick="location.reload()">Повторить</button>
        <p class="hint">Введённое в форму записи не потеряно — после восстановления связи откройте форму и нажмите «Восстановить».</p>
    </div>
    <script>
        window.addEventListener('online', function () { location.reload(); });
        setInterval(function () { fetch('/csrf-token', { cache: 'no-store' }).then(function (r) { if (r.ok) location.reload(); }).catch(function () {}); }, 10000);
    </script>
</body>
</html>
