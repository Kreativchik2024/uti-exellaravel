    <circle cx="180" cy="135" r="4.5"/>
    <circle cx="75" cy="135" r="4.5"/>
    <circle cx="85" cy="60" r="4.5"/>
    <circle cx="100" cy="225" r="4.5"/>
    <circle cx="100" cy="20" r="4.5"/>
  </g>
  <!-- площадки: резистор R7 и микросхема U3 -->
  <g fill="#d8b25a" fill-opacity=".28">
    <rect x="34" y="68" width="10" height="14" rx="1.5"/>
    <rect x="58" y="68" width="10" height="14" rx="1.5"/>
    <rect x="62" y="104" width="8" height="5" rx="1"/>
    <rect x="62" y="110" width="8" height="5" rx="1"/>
    <rect x="62" y="116" width="8" height="5" rx="1"/>
    <rect x="128" y="142" width="5" height="8" rx="1"/><rect x="138" y="142" width="5" height="8" rx="1"/>
    <rect x="148" y="142" width="5" height="8" rx="1"/><rect x="158" y="142" width="5" height="8" rx="1"/>
    <rect x="128" y="180" width="5" height="8" rx="1"/><rect x="138" y="180" width="5" height="8" rx="1"/>
    <rect x="148" y="180" width="5" height="8" rx="1"/><rect x="158" y="180" width="5" height="8" rx="1"/>
