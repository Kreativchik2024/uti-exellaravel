    <g stroke="#0f5a3a" stroke-width="3">
      <path d="M210 0V80L195 95V160L210 175V240"/>
      <path d="M100 0V20L85 35V60"/>
      <path d="M100 240V225"/>
    </g>
    <!-- верхний слой -->
    <g stroke="#c9a046" stroke-opacity=".26" stroke-width="3">
      <path d="M0 30H70L90 50H170L190 30H240"/>
      <path d="M0 200H100L115 215H160L175 200H240"/>
      <path d="M0 150H30L45 135H75"/>
      <path d="M140 90V120L155 135H180"/>
      <path d="M85 60V75H52"/>
      <path d="M150 186V200"/>
    </g>
    <g stroke="#c9a046" stroke-opacity=".18" stroke-width="1.6">
      <path d="M0 110H20L28 102H60"/>
      <path d="M0 116H22L30 108H60"/>
      <path d="M0 122H24L32 114H60"/>
      <path d="M240 110H220M240 116H222M240 122H224" stroke-opacity=".12"/>
