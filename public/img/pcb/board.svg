    <rect x="30" y="64" width="42" height="22" rx="2"/>
    <rect x="124" y="152" width="44" height="26" rx="1"/>
    <circle cx="130" cy="158" r="1.6" fill="#e8f1ea" fill-opacity=".2"/>
  </g>
  <g fill="#e8f1ea" fill-opacity=".16" font-family="Consolas, monospace" font-size="8" letter-spacing=".5">
